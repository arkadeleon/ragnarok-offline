name: Bug Report
description: Report a problem with Ragnarok Offline.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or Logs
      description: Drag and drop images or log files here.
  - type: input
    id: app-version
    attributes:
      label: App Version
      placeholder: 2.1.1 (1)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS Version
      placeholder: macOS 15.0.0
  - type: input
    id: device-model
    attributes:
      label: Device Model
      placeholder: Mac14,2
  - type: input
    id: remote-client
    attributes:
      label: Remote Client
      placeholder: On / Off
